<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit My Item - CLFP</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header><h1>Campus Lost & Found Portal</h1></header>
<nav>
  <a href="../index.html">Home</a>
  <a href="register.html">Register</a>
  <a href="report-lost.html">Report Lost Item</a>
  <a href="report-found.html">Report Found Item</a>
  <a href="search.html">Search Items</a>
  <a href="claim.html">Claim Item</a>
  <a href="profile.html">My Profile</a>
  <a href="admin.html">Admin</a>
</nav>
<main>
  <h2>Edit or Resolve a Reported Item</h2>

  <label for="emailLookup">Your Email</label>
  <input type="email" id="emailLookup" placeholder="you@cfd.nu.edu.pk">
  <button id="lookupBtn">Load My Items</button>

  <div id="myItems"></div>
</main>

<script src="../js/app.js"></script>
<script>
  function render(email) {
    const myItems = Store.getItems().filter(it => it.reporter && it.reporter.toLowerCase() === email);
    const div = document.getElementById('myItems');
    if (myItems.length === 0) {
      div.innerHTML = '<p>No items found for this email.</p>';
      return;
    }
    div.innerHTML = myItems.map(it => `
      <div class="card">
        <strong>${it.title}</strong> <span class="badge">${it.status}</span><br>
        ${it.description}<br>
        <button data-id="${it.id}" data-action="resolve">Mark as Resolved</button>
        <button data-id="${it.id}" data-action="delete">Delete</button>
      </div>
    `).join('');

    div.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.action === 'resolve') {
          Store.updateItem(btn.dataset.id, { status: 'Resolved' });
        } else {
          Store.deleteItem(btn.dataset.id);
        }
        render(email);
      });
    });
  }

  document.getElementById('lookupBtn').addEventListener('click', () => {
    const email = document.getElementById('emailLookup').value.trim().toLowerCase();
    render(email);
  });
</script>
</body>
</html>
