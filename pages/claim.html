<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Claim Item - CLFP</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header><h1>Campus Lost & Found Portal</h1></header>
<nav>
  <a href="../index.html">Home</a>
  <a href="register.html">Register</a>
  <a href="report-lost.html">Report Lost Item</a>
  <a href="report-found.html">Report Found Item</a>
  <a href="search.html">Search Items</a>
  <a href="claim.html">Claim Item</a>
  <a href="profile.html">My Profile</a>
  <a href="admin.html">Admin</a>
</nav>
<main>
  <h2>Submit a Claim Request</h2>
  <form id="claimForm">
    <label for="itemSelect">Select Item</label>
    <select id="itemSelect" required></select>

    <label for="proof">Proof of Ownership (short description)</label>
    <textarea id="proof" rows="3" required placeholder="e.g. describe a unique mark, serial number, or receipt"></textarea>

    <label for="claimant">Your Email</label>
    <input type="email" id="claimant" required>

    <button type="submit">Submit Claim</button>
  </form>
  <div id="msg" class="msg"></div>
</main>

<script src="../js/app.js"></script>
<script>
  const select = document.getElementById('itemSelect');
  function loadItems() {
    select.innerHTML = '<option value="">Select an item</option>';
    Store.getItems().filter(it => it.status === 'Active').forEach(it => {
      const opt = document.createElement('option');
      opt.value = it.id;
      opt.textContent = `${it.title} (${it.type}, ${it.category})`;
      select.appendChild(opt);
    });
  }
  loadItems();

  const form = document.getElementById('claimForm');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const itemId = select.value;
    if (!itemId) {
      showMessage(msg, 'Please select an item to claim.', 'error');
      return;
    }
    const claim = {
      itemId,
      proof: document.getElementById('proof').value.trim(),
      claimant: document.getElementById('claimant').value.trim(),
      date: new Date().toISOString().split('T')[0],
    };
    Store.saveClaim(claim);
    Store.updateItem(itemId, { status: 'Claim Pending' });
    showMessage(msg, 'Claim request submitted. An admin will review it shortly.', 'success');
    form.reset();
    loadItems();
  });
</script>
</body>
</html>
