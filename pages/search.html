<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Search Items - CLFP</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header><h1>Campus Lost & Found Portal</h1></header>
<nav>
  <a href="../index.html">Home</a>
  <a href="register.html">Register</a>
  <a href="report-lost.html">Report Lost Item</a>
  <a href="report-found.html">Report Found Item</a>
  <a href="search.html">Search Items</a>
  <a href="claim.html">Claim Item</a>
  <a href="profile.html">My Profile</a>
  <a href="admin.html">Admin</a>
</nav>
<main>
  <h2>Search Listed Items</h2>

  <label for="keyword">Keyword</label>
  <input type="text" id="keyword" placeholder="e.g. wallet, ID card">

  <label for="categoryFilter">Category</label>
  <select id="categoryFilter">
    <option value="">All categories</option>
    <option>ID Card</option>
    <option>Electronics</option>
    <option>Books</option>
    <option>Keys</option>
    <option>Wallet</option>
    <option>Other</option>
  </select>

  <label for="typeFilter">Type</label>
  <select id="typeFilter">
    <option value="">Lost & Found</option>
    <option>Lost</option>
    <option>Found</option>
  </select>

  <button id="searchBtn">Search</button>

  <table id="resultsTable">
    <thead>
      <tr><th>Title</th><th>Type</th><th>Category</th><th>Location</th><th>Date</th><th>Status</th></tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>
  <p id="emptyMsg" style="display:none;">No results found for this search.</p>
</main>

<script src="../js/app.js"></script>
<script>
  function render(items) {
    const body = document.getElementById('resultsBody');
    const emptyMsg = document.getElementById('emptyMsg');
    body.innerHTML = '';
    if (items.length === 0) {
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';
    items.forEach(it => {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${it.title}</td><td>${it.type}</td><td>${it.category}</td><td>${it.location}</td><td>${it.date}</td><td>${it.status}</td>`;
      body.appendChild(row);
    });
  }

  function runSearch() {
    const keyword = document.getElementById('keyword').value.trim().toLowerCase();
    const category = document.getElementById('categoryFilter').value;
    const type = document.getElementById('typeFilter').value;

    const filtered = Store.getItems().filter(it => {
      const matchKeyword = !keyword || it.title.toLowerCase().includes(keyword) || it.description.toLowerCase().includes(keyword);
      const matchCategory = !category || it.category === category;
      const matchType = !type || it.type === type;
      return matchKeyword && matchCategory && matchType;
    });
    render(filtered);
  }

  document.getElementById('searchBtn').addEventListener('click', runSearch);
  render(Store.getItems());
</script>
</body>
</html>
