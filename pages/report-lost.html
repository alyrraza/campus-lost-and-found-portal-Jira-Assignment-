<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Report Lost Item - CLFP</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header><h1>Campus Lost & Found Portal</h1></header>
<nav>
  <a href="../index.html">Home</a>
  <a href="register.html">Register</a>
  <a href="report-lost.html">Report Lost Item</a>
  <a href="report-found.html">Report Found Item</a>
  <a href="search.html">Search Items</a>
  <a href="claim.html">Claim Item</a>
  <a href="profile.html">My Profile</a>
  <a href="admin.html">Admin</a>
</nav>
<main>
  <h2>Report a Lost Item</h2>
  <form id="lostForm">
    <label for="title">Item Title</label>
    <input type="text" id="title" required>

    <label for="category">Category</label>
    <select id="category" required>
      <option value="">Select category</option>
      <option>ID Card</option>
      <option>Electronics</option>
      <option>Books</option>
      <option>Keys</option>
      <option>Wallet</option>
      <option>Other</option>
    </select>

    <label for="description">Description</label>
    <textarea id="description" rows="3" required></textarea>

    <label for="location">Last Seen Location</label>
    <input type="text" id="location" required>

    <label for="reporter">Your Email</label>
    <input type="email" id="reporter" required>

    <button type="submit">Submit Report</button>
  </form>
  <div id="msg" class="msg"></div>
</main>

<script src="../js/app.js"></script>
<script>
  const form = document.getElementById('lostForm');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const item = {
      type: 'Lost',
      title: document.getElementById('title').value.trim(),
      category: document.getElementById('category').value,
      description: document.getElementById('description').value.trim(),
      location: document.getElementById('location').value.trim(),
      reporter: document.getElementById('reporter').value.trim(),
      date: new Date().toISOString().split('T')[0],
    };
    Store.saveItem(item);
    showMessage(msg, 'Lost item reported successfully. It is now visible in Search.', 'success');
    form.reset();
  });
</script>
</body>
</html>
