<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin - CLFP</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header><h1>Campus Lost & Found Portal</h1></header>
<nav>
  <a href="../index.html">Home</a>
  <a href="register.html">Register</a>
  <a href="report-lost.html">Report Lost Item</a>
  <a href="report-found.html">Report Found Item</a>
  <a href="search.html">Search Items</a>
  <a href="claim.html">Claim Item</a>
  <a href="profile.html">My Profile</a>
  <a href="admin.html">Admin</a>
</nav>
<main>
  <h2>Admin: Pending Claims</h2>
  <div id="claimsList"></div>

  <h2>Admin: Moderate Listings</h2>
  <table>
    <thead><tr><th>Title</th><th>Type</th><th>Status</th><th>Action</th></tr></thead>
    <tbody id="itemsBody"></tbody>
  </table>
</main>

<script src="../js/app.js"></script>
<script>
  function renderClaims() {
    const list = document.getElementById('claimsList');
    const claims = Store.getClaims().filter(c => c.status === 'Pending');
    const items = Store.getItems();
    list.innerHTML = '';
    if (claims.length === 0) {
      list.innerHTML = '<p>No pending claims.</p>';
      return;
    }
    claims.forEach(c => {
      const item = items.find(it => it.id === c.itemId);
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <strong>${item ? item.title : 'Unknown item'}</strong>
        <span class="badge">${c.status}</span><br>
        Claimant: ${c.claimant}<br>
        Proof: ${c.proof}<br>
        <button data-id="${c.id}" data-action="approve">Approve</button>
        <button data-id="${c.id}" data-action="reject">Reject</button>
      `;
      list.appendChild(div);
    });
    list.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        const claim = Store.getClaims().find(c => c.id === id);
        if (action === 'approve') {
          Store.updateClaim(id, { status: 'Approved' });
          Store.updateItem(claim.itemId, { status: 'Claimed' });
        } else {
          Store.updateClaim(id, { status: 'Rejected' });
          Store.updateItem(claim.itemId, { status: 'Active' });
        }
        renderClaims();
        renderItems();
      });
    });
  }

  function renderItems() {
    const body = document.getElementById('itemsBody');
    body.innerHTML = '';
    Store.getItems().forEach(it => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${it.title}</td><td>${it.type}</td><td>${it.status}</td>
        <td><button data-id="${it.id}">Remove Listing</button></td>
      `;
      body.appendChild(row);
    });
    body.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        Store.deleteItem(btn.dataset.id);
        renderItems();
      });
    });
  }

  renderClaims();
  renderItems();
</script>
</body>
</html>
