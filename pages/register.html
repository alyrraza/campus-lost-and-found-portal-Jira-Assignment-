<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - CLFP</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header><h1>Campus Lost & Found Portal</h1></header>
<nav>
  <a href="../index.html">Home</a>
  <a href="register.html">Register</a>
  <a href="report-lost.html">Report Lost Item</a>
  <a href="report-found.html">Report Found Item</a>
  <a href="search.html">Search Items</a>
  <a href="claim.html">Claim Item</a>
  <a href="profile.html">My Profile</a>
  <a href="admin.html">Admin</a>
</nav>
<main>
  <h2>Create Account</h2>
  <form id="registerForm">
    <label for="name">Full Name</label>
    <input type="text" id="name" required>

    <label for="email">University Email</label>
    <input type="email" id="email" required>

    <label for="password">Password (min 8 characters)</label>
    <input type="password" id="password" minlength="8" required>

    <button type="submit">Register</button>
  </form>
  <div id="msg" class="msg"></div>
</main>

<script src="../js/app.js"></script>
<script>
  const form = document.getElementById('registerForm');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!isValidEmail(email)) {
      showMessage(msg, 'Please enter a valid email address.', 'error');
      return;
    }
    if (Store.emailExists(email)) {
      showMessage(msg, 'An account with this email already exists.', 'error');
      return;
    }
    if (password.length < 8) {
      showMessage(msg, 'Password must be at least 8 characters long.', 'error');
      return;
    }

    Store.saveUser({ name, email, password });
    showMessage(msg, 'Registration successful! You can now log in.', 'success');
    form.reset();
  });
</script>
</body>
</html>
